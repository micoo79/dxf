[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyshape"
version = "1.0.0"
description = "Nyílt fotogrammetriai munkafolyamat (Metashape-szerű) EOV-támogatással"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "Pillow>=9.5",
]

[project.scripts]
pyshape = "pyshape.cli:main"

[tool.setuptools]
packages = ["pyshape", "pyshape.gui"]
